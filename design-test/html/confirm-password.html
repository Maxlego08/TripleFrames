<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Confirme ton identité sur TripleFrames." />
        <title>Confirmation du mot de passe — TripleFrames</title>
        <link rel="icon" href="../svg/brand-logo.svg" type="image/svg+xml" />
        <link rel="stylesheet" href="../css/auth.css" />
        <link rel="stylesheet" href="../css/global-header.css" />
    </head>
    <body class="auth-page auth-page--compact" data-authenticated="true">
        <a class="skip-link" href="#auth-content">Aller au formulaire</a>

        <header class="global-header">
            <div class="global-header__inner">
                <a class="global-header__brand" href="index.html" aria-label="TripleFrames, accueil">
                    <img class="global-header__brand-logo" src="../svg/brand-logo.svg" alt="" width="44" height="36" />
                    <span class="global-header__brand-name">TripleFrames</span>
                </a>

                <nav class="global-header__account-nav global-header__account-nav--guest" aria-label="Compte">
                    <a class="global-header__nav-link" href="login.html">Connexion</a>
                    <a class="global-header__nav-pill" href="register.html">S’inscrire</a>
                </nav>

                <nav class="global-header__account-nav global-header__account-nav--member" aria-label="Compte connecté">
                    <a class="global-header__account-button" href="account.html">
                        <span class="global-header__account-avatar" aria-hidden="true">MC</span>
                        <span>Mon compte</span>
                    </a>
                    <a class="global-header__logout" href="login.html">
                        <img src="../svg/icons/logout.svg" alt="" />
                        <span>Déconnexion</span>
                    </a>
                </nav>
            </div>
        </header>

        <main class="auth-stage" id="auth-content">
            <section class="auth-ticket" aria-labelledby="confirm-password-title">
                <div class="auth-ticket__form-panel">
                    <div class="auth-heading">
                        <p class="auth-heading__step">Contrôle de sécurité</p>
                        <h2 id="confirm-password-title">Confirmer le mot de passe</h2>
                        <p>Cette zone est protégée. Confirme ton identité pour continuer.</p>
                    </div>

                    <button class="button button--secondary auth-passkey" type="button" data-provider="Passkey">
                        <span class="provider-button__icon" aria-hidden="true"><img class="icon" src="../svg/icons/passkey.svg" alt="" /></span>
                        <span>Confirmer avec une passkey</span>
                    </button>

                    <div class="auth-divider"><span>ou confirme avec ton mot de passe</span></div>

                    <form class="auth-form auth-form--compact" id="confirm-password-form" data-auth-form="confirm-password" action="/user/confirm-password" method="post" novalidate>
                        <div class="auth-field">
                            <label class="auth-field__label" for="password">Mot de passe actuel</label>
                            <div class="auth-field__password-wrap">
                                <input
                                    class="auth-field__input"
                                    id="password"
                                    name="password"
                                    type="password"
                                    autocomplete="current-password"
                                    placeholder="Ton mot de passe actuel"
                                    aria-describedby="password-error"
                                    required
                                    autofocus
                                />
                                <button class="auth-field__toggle" type="button" aria-label="Afficher le mot de passe" data-password-toggle="password">Afficher</button>
                            </div>
                            <p class="auth-field__error" id="password-error"></p>
                        </div>

                        <button class="button button--primary" type="submit">
                            <span>Confirmer le mot de passe</span>
                            <img class="icon" src="../svg/icons/shield.svg" alt="" aria-hidden="true" />
                        </button>
                    </form>
                </div>
            </section>
        </main>

        <footer class="auth-footer">
            <p>© TripleFrames</p>
            <nav aria-label="Informations légales">
                <a href="terms.html">Conditions</a>
                <a href="privacy.html">Confidentialité</a>
            </nav>
        </footer>

        <div class="toast" id="auth-toast" role="status" aria-live="polite"></div>
        <script src="../js/auth.js"></script>
        <script src="../js/global-header.js"></script>
    </body>
</html>
