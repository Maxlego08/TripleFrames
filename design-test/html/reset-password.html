<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Choisis un nouveau mot de passe TripleFrames." />
        <title>Réinitialisation du mot de passe — TripleFrames</title>
        <link rel="icon" href="../svg/brand-logo.svg" type="image/svg+xml" />
        <link rel="stylesheet" href="../css/auth.css" />
        <link rel="stylesheet" href="../css/global-header.css" />
    </head>
    <body class="auth-page auth-page--compact">
        <a class="skip-link" href="#auth-content">Aller au formulaire</a>

        <header class="global-header">
            <div class="global-header__inner">
                <a class="global-header__brand" href="index.html" aria-label="TripleFrames, accueil">
                    <img class="global-header__brand-logo" src="../svg/brand-logo.svg" alt="" width="44" height="36" />
                    <span class="global-header__brand-name">TripleFrames</span>
                </a>

                <nav class="global-header__account-nav global-header__account-nav--guest" aria-label="Compte">
                    <a class="global-header__nav-link" href="login.html">Connexion</a>
                    <a class="global-header__nav-pill" href="register.html">S’inscrire</a>
                </nav>

                <nav class="global-header__account-nav global-header__account-nav--member" aria-label="Compte connecté">
                    <a class="global-header__account-button" href="account.html">
                        <span class="global-header__account-avatar" aria-hidden="true">MC</span>
                        <span>Mon compte</span>
                    </a>
                    <a class="global-header__logout" href="login.html">
                        <img src="../svg/icons/logout.svg" alt="" />
                        <span>Déconnexion</span>
                    </a>
                </nav>
            </div>
        </header>

        <main class="auth-stage" id="auth-content">
            <section class="auth-ticket" aria-labelledby="reset-password-title">
                <div class="auth-ticket__form-panel">
                    <div class="auth-heading">
                        <p class="auth-heading__step">Lien de récupération validé</p>
                        <h2 id="reset-password-title">Réinitialiser le mot de passe</h2>
                        <p>Saisis ton nouveau mot de passe ci-dessous.</p>
                    </div>

                    <form class="auth-form" id="reset-password-form" data-auth-form="reset-password" action="/reset-password" method="post" novalidate>
                        <input name="token" type="hidden" value="demo-reset-token" />

                        <div class="auth-field">
                            <label class="auth-field__label" for="email">Adresse e-mail</label>
                            <input
                                class="auth-field__input"
                                id="email"
                                name="email"
                                type="email"
                                autocomplete="email"
                                value="joueur@exemple.fr"
                                aria-describedby="email-error"
                                readonly
                            />
                            <p class="auth-field__error" id="email-error"></p>
                        </div>

                        <div class="auth-form__grid">
                            <div class="auth-field">
                                <label class="auth-field__label" for="password">Nouveau mot de passe</label>
                                <div class="auth-field__password-wrap">
                                    <input
                                        class="auth-field__input"
                                        id="password"
                                        name="password"
                                        type="password"
                                        autocomplete="new-password"
                                        minlength="8"
                                        placeholder="8 caractères minimum"
                                        aria-describedby="password-error"
                                        required
                                        autofocus
                                    />
                                    <button class="auth-field__toggle" type="button" aria-label="Afficher le mot de passe" data-password-toggle="password">Afficher</button>
                                </div>
                                <p class="auth-field__error" id="password-error"></p>
                            </div>

                            <div class="auth-field">
                                <label class="auth-field__label" for="password_confirmation">Confirmer le mot de passe</label>
                                <div class="auth-field__password-wrap">
                                    <input
                                        class="auth-field__input"
                                        id="password_confirmation"
                                        name="password_confirmation"
                                        type="password"
                                        autocomplete="new-password"
                                        placeholder="Répète ton mot de passe"
                                        aria-describedby="password-confirmation-error"
                                        required
                                    />
                                    <button class="auth-field__toggle" type="button" aria-label="Afficher la confirmation" data-password-toggle="password_confirmation">Afficher</button>
                                </div>
                                <p class="auth-field__error" id="password-confirmation-error"></p>
                            </div>
                        </div>

                        <button class="button button--primary" type="submit">
                            <span>Réinitialiser le mot de passe</span>
                            <img class="icon" src="../svg/icons/refresh.svg" alt="" aria-hidden="true" />
                        </button>
                    </form>
                </div>
            </section>
        </main>

        <footer class="auth-footer">
            <p>© TripleFrames</p>
            <nav aria-label="Informations légales">
                <a href="terms.html">Conditions</a>
                <a href="privacy.html">Confidentialité</a>
            </nav>
        </footer>

        <div class="toast" id="auth-toast" role="status" aria-live="polite"></div>
        <script src="../js/auth.js"></script>
        <script src="../js/global-header.js"></script>
    </body>
</html>
