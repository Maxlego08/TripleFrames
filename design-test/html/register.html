<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Crée ton compte TripleFrames." />
        <title>Inscription — TripleFrames</title>
        <link rel="icon" href="../svg/brand-logo.svg" type="image/svg+xml" />
        <link rel="stylesheet" href="../css/auth.css" />
            <link rel="stylesheet" href="../css/global-header.css" />
    </head>
    <body class="auth-page auth-page--register">
        <a class="skip-link" href="#auth-content">Aller au formulaire</a>

        <header class="global-header">
    <div class="global-header__inner">
        <a class="global-header__brand" href="index.html" aria-label="TripleFrames, accueil">
            <img class="global-header__brand-logo" src="../svg/brand-logo.svg" alt="" width="44" height="36" />
            <span class="global-header__brand-name">TripleFrames</span>
        </a>

        <nav class="global-header__account-nav global-header__account-nav--guest" aria-label="Compte">
            <a class="global-header__nav-link" href="login.html">Connexion</a>
            <a class="global-header__nav-pill" href="register.html">S’inscrire</a>
        </nav>

        <nav class="global-header__account-nav global-header__account-nav--member" aria-label="Compte connecté">
            <a class="global-header__account-button" href="account.html">
                <span class="global-header__account-avatar" aria-hidden="true">MC</span>
                <span>Mon compte</span>
            </a>
            <a class="global-header__logout" href="login.html">
                <img src="../svg/icons/logout.svg" alt="" />
                <span>Déconnexion</span>
            </a>
        </nav>
    </div>
</header>

        <main class="auth-stage" id="auth-content">
            <section class="auth-ticket" aria-labelledby="register-title">
                <div class="auth-ticket__form-panel">
                    <div class="auth-heading">
                        <p class="auth-heading__step">Nouveau joueur</p>
                        <h2 id="register-title">Crée ton compte</h2>
                        <p>Tous les champs sont nécessaires pour entrer en jeu.</p>
                    </div>

                    <form class="auth-form auth-form--register" id="register-form" action="/register" method="post" novalidate>
                        <div class="auth-form__grid">
                            <div class="auth-field">
                                <label class="auth-field__label" for="name">Pseudo</label>
                                <input
                                    class="auth-field__input"
                                    id="name"
                                    name="name"
                                    type="text"
                                    autocomplete="nickname"
                                    minlength="3"
                                    maxlength="24"
                                    placeholder="Ex. Marty McFly"
                                    aria-describedby="name-error"
                                    required
                                />
                                <p class="auth-field__error" id="name-error"></p>
                            </div>

                            <div class="auth-field">
                                <label class="auth-field__label" for="email">Adresse e-mail</label>
                                <input
                                    class="auth-field__input"
                                    id="email"
                                    name="email"
                                    type="email"
                                    autocomplete="email"
                                    inputmode="email"
                                    placeholder="toi@exemple.fr"
                                    aria-describedby="email-error"
                                    required
                                />
                                <p class="auth-field__error" id="email-error"></p>
                            </div>

                            <div class="auth-field">
                                <label class="auth-field__label" for="password">Mot de passe</label>
                                <div class="auth-field__password-wrap">
                                    <input
                                        class="auth-field__input"
                                        id="password"
                                        name="password"
                                        type="password"
                                        autocomplete="new-password"
                                        minlength="8"
                                        placeholder="8 caractères minimum"
                                        aria-describedby="password-help password-error"
                                        required
                                    />
                                    <button class="auth-field__toggle" type="button" aria-label="Afficher le mot de passe" data-password-toggle="password">
                                        Afficher
                                    </button>
                                </div>
                                <div class="password-meter" id="password-help" aria-label="Solidité du mot de passe">
                                    <span></span><span></span><span></span><span></span>
                                </div>
                                <p class="auth-field__error" id="password-error"></p>
                            </div>

                            <div class="auth-field">
                                <label class="auth-field__label" for="password_confirmation">Confirme le mot de passe</label>
                                <div class="auth-field__password-wrap">
                                    <input
                                        class="auth-field__input"
                                        id="password_confirmation"
                                        name="password_confirmation"
                                        type="password"
                                        autocomplete="new-password"
                                        placeholder="Répète ton mot de passe"
                                        aria-describedby="password-confirmation-error"
                                        required
                                    />
                                    <button class="auth-field__toggle" type="button" aria-label="Afficher la confirmation" data-password-toggle="password_confirmation">
                                        Afficher
                                    </button>
                                </div>
                                <p class="auth-field__error" id="password-confirmation-error"></p>
                            </div>
                        </div>

                        <label class="auth-check auth-check--terms">
                            <input id="terms" name="terms" type="checkbox" value="1" aria-describedby="terms-error" required />
                            <span class="auth-check__box" aria-hidden="true"></span>
                            <span>J’accepte les <a href="terms.html">conditions d’utilisation</a> et la <a href="privacy.html">politique de confidentialité</a>.</span>
                        </label>
                        <p class="auth-field__error auth-field__error--terms" id="terms-error"></p>

                        <button class="button button--primary" type="submit">
                            <span>Créer mon compte</span>
                            <img class="icon" src="../svg/icons/spark.svg" alt="" aria-hidden="true" />
                        </button>
                    </form>

                    <div class="auth-divider"><span>ou crée ton compte avec</span></div>

                    <div class="auth-providers" aria-label="Autres méthodes d’inscription">
                        <button class="provider-button provider-button--passkey" type="button" data-provider="Passkey">
                            <span class="provider-button__icon" aria-hidden="true"><img class="icon" src="../svg/icons/passkey.svg" alt="" /></span>
                            <span>Passkey</span>
                        </button>
                        <button class="provider-button" type="button" data-provider="Google">
                            <span class="provider-button__icon" aria-hidden="true"><img class="icon" src="../svg/icons/google.svg" alt="" /></span>
                            <span>Google</span>
                        </button>
                        <button class="provider-button provider-button--discord" type="button" data-provider="Discord">
                            <span class="provider-button__icon" aria-hidden="true"><img class="icon" src="../svg/icons/discord.svg" alt="" /></span>
                            <span>Discord</span>
                        </button>
                    </div>
                </div>
            </section>
        </main>

        <footer class="auth-footer">
            <p>© TripleFrames</p>
            <nav aria-label="Informations légales">
                <a href="terms.html">Conditions</a>
                <a href="privacy.html">Confidentialité</a>
            </nav>
        </footer>

        <div class="toast" id="auth-toast" role="status" aria-live="polite"></div>
        <script src="../js/auth.js"></script>
            <script src="../js/global-header.js"></script>
    </body>
</html>
