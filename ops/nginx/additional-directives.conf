# TripleFrames — directives nginx additionnelles de l'abonnement du jeu
# (spec 100 § 10.5 et § 10.8).
#
# Collées telles quelles dans Plesk : Sites Web et domaines › (domaine du jeu) ›
# Paramètres d'Apache et de nginx › « Directives nginx supplémentaires », après
# remplacement de chaque paramètre (ops/mise-en-service.md § 1). JAMAIS par
# l'édition d'un vhost, que Plesk régénère. Plesk vérifie la syntaxe (nginx -t)
# à l'enregistrement et refuse un texte invalide sans toucher au site.
#
# Après TOUTE modification de ces directives : vérification « langue et cache »
# (ops/mise-en-service.md, étape 5) — deux GET / en Accept-Language fr puis en,
# chacun avec son <html lang>, aucun ne portant Age, X-Cache ni X-Proxy-Cache.
#
# Aucun cache de page complète ici, ni dans Plesk (§ 10.8) : une même URL sert
# deux langues. Jamais de proxy_cache ni de fastcgi_cache dans ce fichier
# (vérifié par tests/Feature/Deploy/OpsTemplatesTest.php).

# Tampon des en-têtes de réponse de PHP-FPM. L'en-tête Link des assets
# préchargés (AddLinkHeadersForPreloadedAssets) dépasse 5 Ko sur les pages du
# back-office (44 fichiers pour la banque d'images) et 4 Ko au lobby ; avec les
# deux cookies, la réponse ne tient plus dans le tampon par défaut de nginx
# (4 Ko) : 502 « upstream sent too big header » dès /login (répétition du
# 28/09). Hérités par la location PHP que Plesk génère.
# À AJUSTER AU RELEVÉ : si Plesk refuse un doublon (« directive is
# duplicate »), sa propre valeur suffit si elle est d'au moins 16k : retirer
# ces deux lignes.
fastcgi_buffer_size 32k;
fastcgi_buffers 16 16k;

# Contrôleur frontal de Laravel. En mode « nginx seul » (proxy Apache désactivé),
# Plesk ne renvoie à PHP-FPM que les URI en .php : sans ce bloc, toute route de
# l'application (/admin, /f/…, /ops/probe/…) répondrait 404 depuis nginx. Les
# fichiers statiques de public/ (build/, robots.txt, avatars/) restent servis
# directement par nginx, avant Laravel.
# À AJUSTER AU RELEVÉ : si Plesk déclare déjà un « location / » pour ce mode
# (refus « duplicate location » à l'enregistrement), retirer ce seul bloc.
location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# Reverb, seul chemin WebSocket publié. « ^~ » : aucune location à expression
# régulière de Plesk (fichiers statiques, .php) ne peut capter /app/. L'API HTTP
# /apps/ n'est PAS publiée : le serveur publie ses événements en boucle locale.
location ^~ /app/ {
    # À AJUSTER AU RELEVÉ : port de bouclage de Reverb, égal à
    # REVERB_SERVER_PORT du .env de production (ss -ltnp : libre, jamais 6379).
    proxy_pass http://127.0.0.1:__TF_REVERB_PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}
