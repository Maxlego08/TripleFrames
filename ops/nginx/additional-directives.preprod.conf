# TripleFrames — directives nginx additionnelles de l'abonnement de
# PRÉPRODUCTION (spec 100 § 18, L100-15).
#
# Collées telles quelles dans Plesk : Sites Web et domaines › (domaine de
# préproduction) › Paramètres d'Apache et de nginx › « Directives nginx
# supplémentaires », après remplacement de chaque paramètre
# (ops/mise-en-service.md § 12). Jamais par l'édition d'un vhost.
#
# Mêmes blocs que la production (ops/nginx/additional-directives.conf), plus
# l'authentification HTTP posée au niveau du serveur : elle est héritée par
# toutes les locations, celles que Plesk génère comme celles-ci, Reverb compris.
# La préproduction n'est jamais publique : sans identifiants, tout répond 401,
# robots.txt compris.
#
# Aucun cache de page complète (§ 10.8), comme en production.

# Authentification HTTP de tout l'abonnement. Le fichier de mots de passe vit
# HORS de la racine du document (htpasswd -B, bcrypt), lisible du seul nginx ;
# les identifiants ne sont jamais dans le dépôt : le poste du porteur les lit
# dans E2E_HTTP_USER et E2E_HTTP_PASSWORD (tests/Browser, spec 100 § 19).
auth_basic "TripleFrames preproduction";
auth_basic_user_file __TF_PREPROD_HTPASSWD_FILE__;

fastcgi_buffer_size 32k;
fastcgi_buffers 16 16k;

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# Reverb de préproduction, seul chemin WebSocket publié, sous la même
# authentification (héritée du niveau serveur).
location ^~ /app/ {
    proxy_pass http://127.0.0.1:__TF_PREPROD_REVERB_PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}
