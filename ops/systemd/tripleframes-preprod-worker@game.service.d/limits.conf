# TripleFrames — plafonds de cgroup du worker de préproduction de la file game
# (spec 100 § 18, L100-15).
#
# Recopié par root (0644) au chemin homologue sous /etc/systemd/system/, par la
# boucle d'installation en tête de ops/systemd/tripleframes-preprod-worker@.service.
# Plus serrés que ceux de la production, et CPUWeight au plancher : sous
# contention, la production et les voisins passent toujours avant la recette.
#
# Syntaxe systemd : commentaire en DÉBUT de ligne seulement.

[Service]
MemoryMax=128M
CPUWeight=10
