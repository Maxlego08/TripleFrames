# TripleFrames — plafonds de cgroup du worker de préproduction de la file
# default (spec 100 § 18, L100-15).
#
# Recopié par root (0644) au chemin homologue sous /etc/systemd/system/, par la
# boucle d'installation en tête de ops/systemd/tripleframes-preprod-worker@.service.
# La préproduction ne cure rien : la file default n'y porte que les e-mails
# (journalisés) et la purge des salons de recette.
#
# Syntaxe systemd : commentaire en DÉBUT de ligne seulement.

[Service]
MemoryMax=128M
CPUWeight=10
