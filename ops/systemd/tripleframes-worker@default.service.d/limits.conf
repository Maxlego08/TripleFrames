# TripleFrames — plafonds de cgroup du worker de la file default (spec 100 § 10.4).
#
# Recopié par root (0644) au chemin homologue sous /etc/systemd/system/, par la
# boucle d'installation en tête de ops/systemd/tripleframes-worker@.service,
# puis systemctl daemon-reload. Vérification après démarrage :
# systemctl show tripleframes-worker@default -p MemoryMax -p CPUWeight
#
# Valeurs de départ, recalibrées par la séance de charge (D33 du 23/09).
# CPUWeight bas : sous contention, Imagick, l'import et la purge passent après
# les voisins, les requêtes de jeu et la file game.
#
# Syntaxe systemd : commentaire en DÉBUT de ligne seulement.

[Service]
# À AJUSTER AU RELEVÉ : RAM du VPS (free -m) ; revu à la baisse sous 4 Go, en
# gardant --memory < memory_limit (ops/systemd/worker-default.env) < MemoryMax.
MemoryMax=512M
CPUWeight=20
