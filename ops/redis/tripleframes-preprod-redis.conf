# TripleFrames — instance Redis dédiée de la PRÉPRODUCTION (spec 100 § 18, L100-15).
#
# Mêmes règles que l'instance de production (ops/redis/tripleframes-redis.conf,
# § 10.3), sur un port, un mot de passe, un répertoire et un plafond PROPRES :
# la préproduction ne partage jamais le Redis de production, ni par une base
# numérotée (qui n'est pas une frontière de sécurité), ni par un mot de passe.
#
# Gabarit versionné, recopié UNE fois par root (ops/mise-en-service.md § 12) :
#
#   install -o root -g tfredis -m 0640 ops/redis/tripleframes-preprod-redis.conf \
#       /etc/tripleframes/tripleframes-preprod-redis.conf
#
# Syntaxe : Redis ne lit un commentaire qu'en DÉBUT de ligne (vérifié par
# tests/Feature/Deploy/OpsTemplatesTest.php).

# Boucle locale seulement, jamais une interface publique.
bind 127.0.0.1
protected-mode yes

# Port de bouclage libre (ss -ltnp), jamais 6379, distinct des ports Redis et
# Reverb de la production et du port Reverb de la préproduction. Même valeur
# dans REDIS_PORT du .env de préproduction.
port __TF_PREPROD_REDIS_PORT__

# Secret long, propre à la préproduction (openssl rand -hex 32), jamais celui
# de la production. Recopié dans REDIS_PASSWORD du .env de préproduction.
requirepass __TF_PREPROD_REDIS_PASSWORD__

# Mêmes commandes désactivées qu'en production : un parcours Playwright doit
# rencontrer exactement le comportement de production (cache:clear refusé).
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command KEYS ""
rename-command CONFIG ""
rename-command DEBUG ""

# Plafond serré : quelques salons de recette, jamais une charge réelle.
# Toujours sous le MemoryMax de ops/systemd/tripleframes-preprod-redis.service.
maxmemory 32mb

# Aucune éviction, comme en production : la préproduction répète la production.
maxmemory-policy noeviction

appendonly yes
appendfsync everysec
save ""

# Créé par systemd (StateDirectory=tripleframes-preprod-redis de l'unité).
dir /var/lib/tripleframes-preprod-redis

daemonize no
supervised systemd
logfile ""
