# TripleFrames — instance Redis dédiée (spec 100 § 10.3).
#
# Gabarit versionné, recopié UNE fois par root (ops/mise-en-service.md, étape 4) :
#
#   install -d -o root -g root -m 0755 /etc/tripleframes
#   install -o root -g tfredis -m 0640 ops/redis/tripleframes-redis.conf \
#       /etc/tripleframes/tripleframes-redis.conf
#
# puis complété SUR LE SERVEUR : chaque paramètre à remplacer
# (ops/mise-en-service.md § 1) est remplacé, chaque valeur précédée de
# « À AJUSTER AU RELEVÉ » est confirmée ou corrigée selon le relevé du VPS
# (§ 10.1). Toute autre modification passe d'abord par le dépôt : un réglage
# système qu'on ne peut pas relire dans le dépôt ne peut pas être revu.
#
# Syntaxe : Redis ne lit un commentaire qu'en DÉBUT de ligne. Aucun commentaire
# en fin de ligne : « maxmemory 256mb # … » ferait refuser tout le fichier
# (vérifié par tests/Feature/Deploy/OpsTemplatesTest.php).
#
# Pourquoi une instance dédiée : une base numérotée n'est pas une frontière de
# sécurité, et un FLUSHALL voisin effacerait les jobs de frontière et le drapeau
# de drainage en pleine partie. Redis n'est jamais source de vérité du temps :
# round.started_at et round_tier le sont.

# Boucle locale seulement, jamais une interface publique.
bind 127.0.0.1
protected-mode yes

# À AJUSTER AU RELEVÉ : port de bouclage libre (ss -ltnp), jamais 6379, distinct
# de celui de Reverb. Même valeur dans REDIS_PORT du .env de production.
port __TF_REDIS_PORT__

# Secret long, propre à l'abonnement, généré sur le serveur (openssl rand -hex 32)
# et recopié dans REDIS_PASSWORD du .env de production. Jamais dans le dépôt.
requirepass __TF_REDIS_PASSWORD__

# Commandes désactivées. FLUSHDB désactivée fait échouer « php artisan
# cache:clear » : c'est voulu, ce geste effacerait le drapeau de drainage, les
# battements, le signal de redémarrage des workers et l'état des limiteurs.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command KEYS ""
rename-command CONFIG ""
rename-command DEBUG ""

# À AJUSTER AU RELEVÉ : valeur de départ, recalibrée par la séance de charge
# (D33 du 23/09) et revue à la baisse si le VPS a moins de 4 Go. Toujours sous
# le MemoryMax de ops/systemd/tripleframes-redis.service, pour que le plafond de
# Redis joue avant celui du cgroup.
maxmemory 256mb

# Aucune éviction : évincer un job différé figerait une manche. Mémoire pleine =
# écritures refusées et alerte, jamais une perte silencieuse.
maxmemory-policy noeviction

# Persistance par journal seul : le drapeau de drainage et les jobs différés
# survivent à un redémarrage.
appendonly yes
appendfsync everysec
save ""

# Créé par systemd (StateDirectory=tripleframes-redis de l'unité), 0700 à tfredis.
dir /var/lib/tripleframes-redis

# Premier plan, supervisé par systemd (Type=notify) ; journal sur la sortie
# standard, donc dans journald (journalctl -u tripleframes-redis).
daemonize no
supervised systemd
logfile ""
