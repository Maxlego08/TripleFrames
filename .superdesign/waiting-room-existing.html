<!DOCTYPE html><html lang="fr"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salle d’attente — TripleFrames</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Trebuchet+MS:wght@400;700&display=swap');
        @font-face {
            font-family: 'Arial Rounded MT Bold';
            src: local('Arial Rounded MT Bold');
        }

        /* Core theme variables from tokens */
        :root {
            --color-ink: oklch(0.27 0.08 292);
            --color-violet: oklch(0.4 0.15 295);
            --color-violet-dark: oklch(0.3 0.11 295);
            --color-paper: oklch(0.98 0.03 91);
            --color-white: oklch(1 0 0);
            --color-coral: oklch(0.7 0.2 25);
            --color-cyan: oklch(0.81 0.13 195);
            --color-yellow: oklch(0.88 0.16 89);
            --color-lavender: oklch(0.86 0.08 296);
            --color-night: oklch(0.16 0.04 290);
            --color-muted: oklch(0.47 0.04 295);
            --font-display: 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif;
            --font-body: 'Trebuchet MS', 'Segoe UI', sans-serif;
            --line-width: 0.1875rem;
        }

        body {
            font-family: var(--font-body);
            color: var(--color-ink);
            margin: 0;
            overflow: hidden;
            background: repeating-linear-gradient(
                90deg,
                var(--color-violet) 0 5.5rem,
                oklch(0.44 0.15 295) 5.5rem 9rem,
                oklch(0.34 0.14 295) 9rem 13rem
            );
        }

        /* Typography Classes */
        .font-display {
            font-family: var(--font-display);
            font-weight: 900;
        }

        /* Buttons & Surfaces Base Styles */
        .hard-border {
            border: var(--line-width) solid var(--color-ink);
        }
        .hard-shadow {
            box-shadow: 0.3125rem 0.3125rem 0 var(--color-ink);
        }
        .hard-shadow-night {
            box-shadow: 0.3125rem 0.3125rem 0 var(--color-night);
        }
        .hard-shadow-large {
            box-shadow: 0.58rem 0.58rem 0 var(--color-night), -0.42rem -0.35rem 0 var(--color-yellow);
        }

        /* Waiting Room Layout */
        .waiting-room-container {
            display: grid;
            width: min(100% - 2rem, 82rem);
            height: 100svh;
            margin: 0 auto;
            grid-template-rows: auto minmax(0, 1fr) auto;
            gap: 3rem;
            padding: 1.1rem 0;
            position: relative;
        }

        /* Brand Floating Logo */
        .brand-pill {
            position: fixed;
            z-index: 35;
            top: 1rem;
            left: 1.25rem;
            background: var(--color-paper);
            border-radius: 999px;
            padding: 0.38rem 0.8rem 0.38rem 0.48rem;
            box-shadow: 0.22rem 0.22rem 0 var(--color-night);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
        }

        /* Cinema Scene Setup */
        .cinema-room-wrap {
            position: relative;
            min-height: 0;
            overflow: hidden;
            border-radius: 1.8rem;
            background: linear-gradient(90deg, oklch(0.18 0.06 293) 0 9%, transparent 18% 82%, oklch(0.18 0.06 293) 91% 100%),
                        linear-gradient(180deg, oklch(0.2 0.07 293), oklch(0.29 0.12 294));
        }

        .cinema-scene {
            position: absolute;
            inset: 0;
            perspective: 62rem;
            perspective-origin: 50% 38%;
            transform-origin: center 55%;
            transform-style: preserve-3d;
        }

        /* Cinema Layers */
        .cinema-wall {
            position: absolute;
            z-index: 0;
            inset: 0 0 52%;
            background: radial-gradient(circle at 50% 55%, oklch(0.84 0.1 89 / 0.12), transparent 34%),
                        repeating-linear-gradient(90deg, transparent 0 8rem, oklch(0.61 0.08 295 / 0.08) 8rem 8.15rem);
        }

        .cinema-screen {
            position: absolute;
            z-index: 4;
            top: 9%;
            left: 50%;
            width: min(48vw, 39rem);
            height: 25%;
            border-radius: 0.8rem;
            background: linear-gradient(135deg, oklch(0.99 0.025 91 / 0.95), oklch(0.89 0.1 195 / 0.9)), var(--color-paper);
            box-shadow: 0 0 0 0.45rem oklch(0.42 0.12 294), 0 0 2.8rem oklch(0.88 0.13 195 / 0.28), 0 0.8rem 0 var(--color-night);
            transform: translateX(-50%) rotateX(-3deg);
            transform-origin: center top;
            display: grid;
            place-items: center;
        }

        .cinema-light-beam {
            position: absolute;
            z-index: 1;
            top: 30%;
            bottom: 4%;
            left: 15%;
            width: 70%;
            background: linear-gradient(180deg, oklch(0.95 0.08 91 / 0.09), oklch(0.82 0.09 195 / 0.025));
            clip-path: polygon(32% 0, 68% 0, 100% 100%, 0 100%);
            pointer-events: none;
        }

        .cinema-floor {
            position: absolute;
            z-index: 2;
            inset: 35% 3% -22%;
            background: repeating-linear-gradient(90deg, transparent 0 8rem, oklch(0.81 0.13 195 / 0.12) 8rem 8.12rem),
                        repeating-linear-gradient(0deg, transparent 0 5rem, oklch(0.88 0.16 89 / 0.1) 5rem 5.12rem),
                        linear-gradient(180deg, oklch(0.26 0.1 294 / 0.16), oklch(0.18 0.08 294 / 0.42));
            clip-path: polygon(16% 0, 84% 0, 100% 100%, 0 100%);
            transform: translateZ(-10rem);
            pointer-events: none;
        }

        .cinema-aisle {
            position: absolute;
            z-index: 3;
            top: 38%;
            bottom: -4%;
            width: 7%;
            background: linear-gradient(180deg, oklch(0.81 0.13 195 / 0.08), oklch(0.81 0.13 195 / 0.3));
            clip-path: polygon(40% 0, 60% 0, 100% 100%, 0 100%);
            filter: drop-shadow(0 0 0.4rem oklch(0.81 0.13 195 / 0.35));
        }

        .cinema-seats-layer {
            position: absolute;
            z-index: 5;
            inset: 0;
            transform: translateZ(5rem);
            transform-style: preserve-3d;
        }

        /* Seat Positioning CSS */
        .seat-base {
            position: absolute;
            width: 9rem;
            height: 7.5rem;
            transform-origin: center bottom;
            transform-style: preserve-3d;
        }

        .seat-row-1 { --seat-depth: -13rem; --seat-scale: 0.68; z-index: 6; top: 43%; }
        .seat-row-2 { --seat-depth: -3rem; --seat-scale: 0.86; z-index: 10; top: 62%; }
        .seat-row-3 { --seat-depth: 8rem; --seat-scale: 1.05; z-index: 15; top: 79%; }

        .seat-pos-1 { left: 37%; transform: translate3d(-50%, -50%, var(--seat-depth)) scale(var(--seat-scale)); }
        .seat-pos-2 { left: 45.5%; transform: translate3d(-50%, -50%, var(--seat-depth)) scale(var(--seat-scale)); }
        .seat-pos-3 { left: 54.5%; transform: translate3d(-50%, -50%, var(--seat-depth)) scale(var(--seat-scale)); }
        .seat-pos-4 { left: 63%; transform: translate3d(-50%, -50%, var(--seat-depth)) scale(var(--seat-scale)); }
        
        .seat-pos-5 { left: 31%; transform: translate3d(-50%, -50%, var(--seat-depth)) scale(var(--seat-scale)); }
        .seat-pos-6 { left: 43.5%; transform: translate3d(-50%, -50%, var(--seat-depth)) scale(var(--seat-scale)); }
        .seat-pos-7 { left: 56.5%; transform: translate3d(-50%, -50%, var(--seat-depth)) scale(var(--seat-scale)); }
        .seat-pos-8 { left: 69%; transform: translate3d(-50%, -50%, var(--seat-depth)) scale(var(--seat-scale)); }

        .seat-pos-9 { left: 23%; transform: translate3d(-50%, -50%, var(--seat-depth)) scale(var(--seat-scale)); }
        .seat-pos-10 { left: 41%; transform: translate3d(-50%, -50%, var(--seat-depth)) scale(var(--seat-scale)); }
        .seat-pos-11 { left: 59%; transform: translate3d(-50%, -50%, var(--seat-depth)) scale(var(--seat-scale)); }
        .seat-pos-12 { left: 77%; transform: translate3d(-50%, -50%, var(--seat-depth)) scale(var(--seat-scale)); }

        .seat-chair {
            position: absolute;
            z-index: 1;
            right: 0.7rem;
            bottom: 0.8rem;
            left: 0.7rem;
            height: 4.25rem;
            border-radius: 1.35rem 1.35rem 0.62rem 0.62rem;
            background: var(--color-coral);
            box-shadow: 0 0.55rem 0 var(--color-ink);
        }
        .seat-empty .seat-chair {
            background: oklch(0.48 0.08 296);
            opacity: 0.43;
        }
        .seat-current .seat-chair {
            background: var(--color-cyan);
            box-shadow: 0 0 0 0.2rem var(--color-yellow), 0 0.55rem 0 var(--color-ink);
        }

        .avatar-base {
            position: relative;
            width: 3.6rem;
            aspect-ratio: 1;
            border-radius: 50%;
            box-shadow: 0.18rem 0.18rem 0 var(--color-ink);
        }
        .avatar-large {
            width: 5.15rem;
            box-shadow: 0.28rem 0.28rem 0 var(--color-ink);
        }

        .avatar-spark {
            position: absolute;
            top: -0.32rem;
            right: -0.18rem;
            width: 1.3rem;
            height: 1.3rem;
            background: var(--color-paper);
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 0.65rem;
        }

        /* UI Action Buttons */
        .btn-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.55rem;
            min-height: 3.45rem;
            border-radius: 0.85rem;
            padding: 0.65rem 1rem;
            font-weight: 900;
            cursor: pointer;
            transition: translate 120ms ease, box-shadow 120ms ease;
        }
        .btn-action:hover {
            translate: 0 -0.1rem;
            box-shadow: 0.34rem 0.36rem 0 var(--color-night);
        }
    </style>
</head>
