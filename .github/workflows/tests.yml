name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # Une PR poussée trois fois ne consomme qu'une exécution ; `main` n'est
    # jamais annulée, parce qu'elle alimente la construction des artefacts.
    # Hors PR, chaque exécution a donc SON groupe (`run_id`) : GitHub ne garde
    # qu'une exécution en attente par groupe et annule celle qui attendait
    # quand une troisième arrive, même sans `cancel-in-progress`.
    concurrency:
      group: tests-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          # `ext-imagick` est une dépendance applicative déclarée dans composer.json :
          # le réencodage des images de jeu et les fixtures du catalogue en dépendent.
          extensions: imagick
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
